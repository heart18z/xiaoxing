#blade配置
blade:
  #oauth2配置
  oauth2:
    enabled: true
    public-key: 04ddcbd16c70e495a0cc4107fef6df86bce8997c53daa6a421e520a79c18993054c4cd87c8173022543fda4e281642f6e8a080deac7c0e776b17594295058484aa
    private-key: ${XIAOXING_APPLICATION_YML_PRIVATE_KEY_11}
  #认证扩展配置
  auth:
    refresh-filter:
      # 有操作自动续期：JWT 过半生命周期时服务端静默换发 access_token（不依赖 refresh_token）
      enabled: true
  #token配置
  token:
    #是否有状态
    state: true
    #是否单用户登录
    single: true
    #单用户登录范围
    single-level: all
    #token签名
    #使用 @org.springblade.test.SignKeyGenerator 获取
    sign-key: ${XIAOXING_APPLICATION_YML_SIGN_KEY_12}
  #redis序列化方式
  redis:
    serializer-type: protostuff
  #接口配置
  api:
    #报文加密配置
    crypto:
      #启用报文加密配置
      enabled: false
      #使用AesUtil.genAesKey()生成
      aes-key: O2BEeIv399qHQNhD6aGW8R8DEj4bqHXm
      #使用DesUtil.genDesKey()生成
      des-key: jMVCBsFGDQr1USHo
  #jackson配置
  jackson:
    #null自动转空值
    null-to-empty: true
    #大数字自动转字符串
    big-num-to-string: true
    #支持text文本请求,与报文加密同时开启
    support-text-plain: false
  #日志配置
  log:
    request:
      #开启控制台请求日志
      enabled: true
      #控制台请求日志忽略
      skip-url:
        - /blade-desk/notice/list
        - /blade-chat/weixin/**
        - /blade-smart/ai-config/**
        - /app/reminder/audio/**
        - /app/reminder/settings/**
        - /app/push/**
      #开启错误日志入库
      error-log: true
  #xss配置
  xss:
    enabled: true
    skip-url:
      - /blade-chat/weixin
      - /blade-bizNotice/bizNotice/addNotice
      - /blade-flow/model/submit
      - /blade-unifiedMessagingSend/unifiedMessagingSend/submit
      - /app/reminder/**
      - /blade-smart/ai-config/**
  #安全框架配置
  secure:
    #接口放行
    skip-url:
      - /blade-test/**
      - /blade-system/param/login-page-param
      - /blade-system/param/favicon
      - /open/**
      - /unified-oauth/get-login-url
    #授权认证配置
    auth:
      - method: ALL
        pattern: /blade-chat/weixin/**
        expression: "hasAuth()"
      - method: POST
        pattern: /blade-desk/dashboard/upload
        expression: "hasTimeAuth(9, 17)"
      - method: POST
        pattern: /blade-desk/dashboard/submit
        expression: "hasAnyRole('administrator', 'admin', 'user')"
    #基础认证配置
    basic:
      - method: ALL
        pattern: /blade-desk/dashboard/info
        username: "blade"
        password: ${XIAOXING_APPLICATION_YML_PASSWORD_13}
    system-api:
      - method: ALL
        pattern: /auth-test/**


    #动态签名认证配置
    sign:
      - method: ALL
        pattern: /blade-desk/dashboard/sign
        crypto: "sha1"
    #多终端认证配置
    client:
      - client-id: sword
        path-patterns:
          - /blade-sword/**
      - client-id: saber
        path-patterns:
          - /blade-saber/**
  #多租户配置（单租户模式：保留 tenant_id 字段隔离，关闭增强授权与动态数据源）
  tenant:
    #多租户增强（4.9 会加载 pojo.entity.Tenant，单租户场景务必关闭）
    enhance: false
    #多租户授权保护
    license: false
    #默认租户
    default-tenant-id: 000000
    #动态数据源功能
    dynamic-datasource: false
    #动态数据源全局扫描
    dynamic-global: false
    #多租户字段名
    column: tenant_id
    #排除多租户逻辑
    exclude-tables:
      - blade_user
      - blade_ai_btn_config
      - blade_ai_btn_config_detail
