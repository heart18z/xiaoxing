<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8' />
  <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta http-equiv='X-UA-Compatible' content='chrome=1' />
  <meta name='renderer' content='webkit'>
  <meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0'>
  <meta name='apple-mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-status-bar-style' content='black'>
  <meta name='format-detection' content='telephone=no'>
  <link rel='icon' href='/favicon.png' />
  <script>
    (function () {
      if (location.pathname.startsWith('/app')) {
        document.querySelector("link[rel='icon']").href = '/avatars/assistant/A3.png';
        return;
      }
      const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/x-icon';
      link.rel = 'shortcut icon';
      link.href = '/api/blade-system/param/favicon';
      document.getElementsByTagName('head')[0].appendChild(link);
    })();
  </script>
  <link rel='stylesheet' href='/iconfont/index.css'>
  <link rel='stylesheet' href='/iconfont/avue/iconfont.css'>
  <link rel='stylesheet' href='/iconfont/saber/iconfont.css'>
  <link rel='stylesheet' href='/iconfont/common/iconfont.css'>
  <link rel='stylesheet' href='/css/loading.css'>
  <link rel='stylesheet' href='/css/saber.css'>
  <title>BladeX微服务开发平台</title>
</head>

<body>
<div id='app'>
  <div id='loader-wrapper'>
    <div class='loader-box'>
      <span>BladeX</span>
      <span>微</span>
      <span>服</span>
      <span>务</span>
      <span>开</span>
      <span>发</span>
      <span>平</span>
      <span>台</span>
    </div>
    <div class='loader-title'>系统加载中</div>
  </div>
</div>
<script type='module' src='/src/main.js'></script>
</body>

</html>
